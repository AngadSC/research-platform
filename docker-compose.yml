x-env: &env
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false

services:
  postgres:
    image: postgres:16
    <<: *env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    <<: *env
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
    volumes:
      - ./backend:/app
      - labfiles:/data/lab_files  # lab attachments; never served by a static route
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build: ./backend
    <<: *env
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  beat:
    build: ./backend
    <<: *env
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./backend/schema.yml:/schema/schema.yml:ro
    ports:
      - "5173:5173"

volumes:
  pgdata:
  labfiles:
