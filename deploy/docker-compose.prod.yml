# Production stack example. Run from the deploy/ directory:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm backend python manage.py migrate
#   docker compose -f docker-compose.prod.yml up -d
# Secrets live only in .env.prod (copy from .env.prod.example). Nothing secret is written here.
# Only caddy publishes ports. Postgres, Valkey, gunicorn, worker and beat stay on the private network.

x-env: &env
  env_file:
    - .env.prod

services:
  postgres:
    image: postgres:16
    <<: *env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    <<: *env
    restart: unless-stopped
    # The password comes from .env.prod at runtime, so it never appears in this file or in `docker inspect`.
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --appendonly yes"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - valkeydata:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    image: research-backend:prod
    <<: *env
    restart: unless-stopped
    # Uploaded files when no LAB_FILES_BUCKET is set (local disk storage).
    volumes:
      - labfiles:/data/lab_files
    # D190: the in-app assistant streams answers (server-sent events) that can run for minutes.
    # gthread keeps one open stream from using up a whole worker, and the timeout is raised from
    # the 30 s default so a long answer is not killed. Caddy must not buffer them (see Caddyfile).
    # D196: capacity is workers x threads = 3 x 8 = 24 threads. Each open stream holds one, so the
    # app caps streams server-wide (ASSISTANT_MAX_STREAMS, default 10, leaving 14 threads for
    # ordinary requests; keep it well below workers x threads if you change either) and stops
    # every stream after ASSISTANT_STREAM_DEADLINE (default 300 s), which must stay below the
    # 330 s gunicorn --timeout here and the 330 s read_timeout in the Caddyfile, so the app ends a
    # stream cleanly before a proxy cuts it. ASSISTANT_LOCK_TTL (default 600 s) must exceed the
    # deadline plus the provider read timeout (120 s).
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--worker-class", "gthread", "--threads", "8", "--timeout", "330", "--access-logfile", "-", "--access-logformat", "%(h)s %(l)s %(u)s %(t)s \"%(m)s %(U)s %(H)s\" %(s)s %(b)s \"%(a)s\""]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    image: research-backend:prod
    <<: *env
    restart: unless-stopped
    volumes:
      - labfiles:/data/lab_files
    # The image's HEALTHCHECK probes gunicorn, which only the backend runs.
    healthcheck:
      disable: true
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Instrument files are read here, apart from the default worker: a parser child may use up to
  # 1 GB, so two at a time (2 GB at most) and a flood of drops cannot hold up email or alerts.
  worker-parsing:
    image: research-backend:prod
    <<: *env
    restart: unless-stopped
    volumes:
      - labfiles:/data/lab_files
    healthcheck:
      disable: true
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "parsing", "--concurrency=2", "-n", "parsing@%h"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  beat:
    image: research-backend:prod
    <<: *env
    restart: unless-stopped
    # The app user cannot write /app, so the schedule file goes to /tmp.
    # The image's HEALTHCHECK probes gunicorn, which only the backend runs.
    healthcheck:
      disable: true
    command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # D380: site analytics. Its own database and user in the postgres service; DATABASE_URL and
  # APP_SECRET come from deploy/.env (UMAMI_DATABASE_URL, UMAMI_APP_SECRET), never .env.prod, so
  # the app never sees them. Caddy serves its tracker at /u/ and its dashboard at stats.<domain>.
  umami:
    # Pinned by digest: its tracker script runs on our own origin, so it is trusted like app code.
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    restart: unless-stopped
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:?set UMAMI_DATABASE_URL in deploy/.env}
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in deploy/.env}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # Caddy sets X-Forwarded-For from the real connection; never trust other client-sent headers.
      CLIENT_IP_HEADER: x-forwarded-for
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # deploy/.env (not committed) holds SITE_DOMAIN=your.domain; compose reads it automatically.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data  # certificates; back this up or Caddy re-requests them
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - umami

volumes:
  pgdata:
  labfiles:
  valkeydata:
  caddydata:
  caddyconfig:
