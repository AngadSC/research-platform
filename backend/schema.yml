          description: ''
  /api/labs/:
    get:
      operationId: labs_list
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lab'
          description: ''
    post:
      operationId: labs_create
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lab'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lab'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Lab'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/labs/{lab_id}/:
    get:
      operationId: labs_retrieve
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
    patch:
      operationId: labs_partial_update
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLab'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLab'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLab'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/labs/{lab_id}/analyses/{analysis_id}/:
    get:
      operationId: labs_analyses_retrieve
      description: |-
        One view pair per kind. `ProjectScopedMixin` resolves and permission-checks the project
        (404 if invisible); reads then go through `serializers.queryset`, which is scoped to that
        project and prefetches every nested link, so no list or detail makes per-row queries.
      parameters:
      - in: path
        name: analysis_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          description: ''
    patch:
      operationId: labs_analyses_partial_update
      description: |-
        One view pair per kind. `ProjectScopedMixin` resolves and permission-checks the project
        (404 if invisible); reads then go through `serializers.queryset`, which is scoped to that
        project and prefetches every nested link, so no list or detail makes per-row queries.
      parameters:
      - in: path
        name: analysis_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisInput'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          description: ''
    delete:
      operationId: labs_analyses_destroy
      description: |-
        One view pair per kind. `ProjectScopedMixin` resolves and permission-checks the project
        (404 if invisible); reads then go through `serializers.queryset`, which is scoped to that
        project and prefetches every nested link, so no list or detail makes per-row queries.
      parameters:
      - in: path
        name: analysis_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/labs/{lab_id}/attachments/{attachment_id}/:
    get:
      operationId: labs_attachments_retrieve
      description: |-
        HasPerm reads `view.project`. Collection routes take the project from the URL (404 if
        not visible); item routes take it from the visible object the URL names, so an invisible
        object is a 404 before any 403 (D21).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: labs_attachments_destroy
      description: |-
        HasPerm reads `view.project`. Collection routes take the project from the URL (404 if
        not visible); item routes take it from the visible object the URL names, so an invisible
        object is a 404 before any 403 (D21).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/labs/{lab_id}/attachments/{attachment_id}/download/:
    get:
      operationId: labs_attachments_download_retrieve
      description: 'ARCHITECTURE section 8: scoped lookup, permission, audit, then
        stream.'
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/labs/{lab_id}/audit-events/:
    get:
      operationId: labs_audit_events_list
      description: Read-only. AuditEvent is not lab-scoped (D23), so the lab filter
        is explicit here.
      parameters:
      - in: query
        name: action
        schema:
          enum:
          - auth.login
          - auth.login_failed
          - auth.logout
          - auth.password_changed
          - auth.mfa_enabled
          - auth.mfa_disabled
          - lab.created
          - lab.updated
          - membership.invited
          - membership.invite_revoked
          - membership.invite_accepted
          - membership.role_changed
          - membership.removed
          - project_membership.added
          - project_membership.role_changed
          - project_membership.removed
          - project.created
          - project.updated
          - project.deleted
          - project.exported
          - document.viewed
          - document.restored
          - document.deleted
          - attachment.uploaded
          - attachment.downloaded
          - attachment.deleted
          - task.deleted
          - deadline.deleted
          - dataset.created
          - dataset.updated
          - dataset.deleted
          - analysis.created
          - analysis.updated
          - analysis.deleted
          - result.created
          - result.updated
          - result.deleted
          - decision.created
          - decision.updated
          - decision.deleted
          - manuscript.created
          - manuscript.updated
          - manuscript.deleted
          - ethics_approval.created
          - ethics_approval.updated
          - ethics_approval.links_changed
          - ethics_approval.deleted
          - retention.changed
          - audit_log.viewed
          - handover.generated
          - task.unassigned
          - auth.social_connected
          - auth.social_disconnected
          - auth.email_added
          - auth.email_removed
          - integration.connected
          - integration.disconnected
          - integration.revoked
          - integration.refresh_failed
          - integration.picker_token_issued
          - external_link.created
          - external_link.removed
          - external_link.change_accepted
          type: string
          minLength: 1
        description: |-
          * `auth.login` - Auth Login
          * `auth.login_failed` - Auth Login Failed
          * `auth.logout` - Auth Logout
          * `auth.password_changed` - Auth Password Changed
          * `auth.mfa_enabled` - Auth Mfa Enabled
          * `auth.mfa_disabled` - Auth Mfa Disabled
          * `lab.created` - Lab Created
          * `lab.updated` - Lab Updated
          * `membership.invited` - Membership Invited
          * `membership.invite_revoked` - Membership Invite Revoked
          * `membership.invite_accepted` - Membership Invite Accepted
          * `membership.role_changed` - Membership Role Changed
          * `membership.removed` - Membership Removed
          * `project_membership.added` - Project Membership Added
          * `project_membership.role_changed` - Project Membership Role Changed
          * `project_membership.removed` - Project Membership Removed
          * `project.created` - Project Created
          * `project.updated` - Project Updated
          * `project.deleted` - Project Deleted
          * `project.exported` - Project Exported
          * `document.viewed` - Document Viewed
          * `document.restored` - Document Restored
          * `document.deleted` - Document Deleted
          * `attachment.uploaded` - Attachment Uploaded
          * `attachment.downloaded` - Attachment Downloaded
          * `attachment.deleted` - Attachment Deleted
          * `task.deleted` - Task Deleted
          * `deadline.deleted` - Deadline Deleted
          * `dataset.created` - Dataset Created
          * `dataset.updated` - Dataset Updated
          * `dataset.deleted` - Dataset Deleted
          * `analysis.created` - Analysis Created
          * `analysis.updated` - Analysis Updated
          * `analysis.deleted` - Analysis Deleted
          * `result.created` - Result Created
          * `result.updated` - Result Updated
          * `result.deleted` - Result Deleted
          * `decision.created` - Decision Created
          * `decision.updated` - Decision Updated
          * `decision.deleted` - Decision Deleted
          * `manuscript.created` - Manuscript Created
          * `manuscript.updated` - Manuscript Updated
          * `manuscript.deleted` - Manuscript Deleted
          * `ethics_approval.created` - Ethics Approval Created
          * `ethics_approval.updated` - Ethics Approval Updated
          * `ethics_approval.links_changed` - Ethics Approval Links Changed
          * `ethics_approval.deleted` - Ethics Approval Deleted
          * `retention.changed` - Retention Changed
          * `audit_log.viewed` - Audit Log Viewed
          * `handover.generated` - Handover Generated
          * `task.unassigned` - Task Unassigned
          * `auth.social_connected` - Auth Social Connected
          * `auth.social_disconnected` - Auth Social Disconnected
          * `auth.email_added` - Auth Email Added
          * `auth.email_removed` - Auth Email Removed
          * `integration.connected` - Integration Connected
          * `integration.disconnected` - Integration Disconnected
          * `integration.revoked` - Integration Revoked
          * `integration.refresh_failed` - Integration Refresh Failed
          * `integration.picker_token_issued` - Integration Picker Token
          * `external_link.created` - External Link Created
          * `external_link.removed` - External Link Removed
          * `external_link.change_accepted` - External Link Change Accepted
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        schema:
          type: string
        description: Pagination cursor
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: target_id
        schema:
          type: string
          format: uuid
      - in: query
        name: target_type
        schema:
          type: string
          minLength: 1
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
