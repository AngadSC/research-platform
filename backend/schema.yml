openapi: 3.0.3
info:
  title: Research Workspace API
  version: 0.1.0
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/invites/accept/:
    post:
      operationId: invites_accept_create
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/invites/preview/:
    post:
      operationId: invites_preview_create
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
          description: ''
  /api/labs/:
    get:
      operationId: labs_list
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lab'
          description: ''
    post:
      operationId: labs_create
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lab'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lab'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Lab'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/labs/{lab_id}/:
    get:
      operationId: labs_retrieve
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
    patch:
      operationId: labs_partial_update
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLab'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLab'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLab'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/labs/{lab_id}/audit-events/:
    get:
      operationId: labs_audit_events_list
      description: Read-only. AuditEvent is not lab-scoped (D23), so the lab filter
        is explicit here.
      parameters:
      - in: query
        name: action
        schema:
          enum:
          - auth.login
          - auth.login_failed
          - auth.logout
          - auth.password_changed
          - auth.mfa_enabled
          - auth.mfa_disabled
          - lab.created
          - lab.updated
          - membership.invited
          - membership.invite_revoked
          - membership.invite_accepted
          - membership.role_changed
          - membership.removed
          - project_membership.added
          - project_membership.role_changed
          - project_membership.removed
          - project.created
          - project.updated
          - project.deleted
          - project.exported
          - document.viewed
          - document.restored
          - document.deleted
          - attachment.uploaded
          - attachment.downloaded
          - attachment.deleted
          - task.deleted
          - deadline.deleted
          - dataset.deleted
          - analysis.deleted
          - result.deleted
          - decision.deleted
          - manuscript.deleted
          - ethics_approval.deleted
          - audit_log.viewed
          - handover.generated
          type: string
          minLength: 1
        description: |-
          * `auth.login` - Auth Login
          * `auth.login_failed` - Auth Login Failed
          * `auth.logout` - Auth Logout
          * `auth.password_changed` - Auth Password Changed
          * `auth.mfa_enabled` - Auth Mfa Enabled
          * `auth.mfa_disabled` - Auth Mfa Disabled
          * `lab.created` - Lab Created
          * `lab.updated` - Lab Updated
          * `membership.invited` - Membership Invited
          * `membership.invite_revoked` - Membership Invite Revoked
          * `membership.invite_accepted` - Membership Invite Accepted
          * `membership.role_changed` - Membership Role Changed
          * `membership.removed` - Membership Removed
          * `project_membership.added` - Project Membership Added
          * `project_membership.role_changed` - Project Membership Role Changed
          * `project_membership.removed` - Project Membership Removed
          * `project.created` - Project Created
          * `project.updated` - Project Updated
          * `project.deleted` - Project Deleted
          * `project.exported` - Project Exported
          * `document.viewed` - Document Viewed
          * `document.restored` - Document Restored
          * `document.deleted` - Document Deleted
          * `attachment.uploaded` - Attachment Uploaded
          * `attachment.downloaded` - Attachment Downloaded
          * `attachment.deleted` - Attachment Deleted
          * `task.deleted` - Task Deleted
          * `deadline.deleted` - Deadline Deleted
          * `dataset.deleted` - Dataset Deleted
          * `analysis.deleted` - Analysis Deleted
          * `result.deleted` - Result Deleted
          * `decision.deleted` - Decision Deleted
          * `manuscript.deleted` - Manuscript Deleted
          * `ethics_approval.deleted` - Ethics Approval Deleted
          * `audit_log.viewed` - Audit Log Viewed
          * `handover.generated` - Handover Generated
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        schema:
          type: string
        description: Pagination cursor
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: target_id
        schema:
          type: string
          format: uuid
      - in: query
        name: target_type
        schema:
          type: string
          minLength: 1
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/labs/{lab_id}/invites/:
    get:
      operationId: labs_invites_list
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
          description: ''
    post:
      operationId: labs_invites_create
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteCreate'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/labs/{lab_id}/invites/{invite_id}/:
    delete:
      operationId: labs_invites_destroy
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: invite_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/labs/{lab_id}/members/:
    get:
      operationId: labs_members_list
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
          description: ''
  /api/labs/{lab_id}/members/{membership_id}/:
    patch:
      operationId: labs_members_partial_update
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRole'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    delete:
      operationId: labs_members_destroy
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - auth.login
      - auth.login_failed
      - auth.logout
      - auth.password_changed
      - auth.mfa_enabled
      - auth.mfa_disabled
      - lab.created
      - lab.updated
      - membership.invited
      - membership.invite_revoked
      - membership.invite_accepted
      - membership.role_changed
      - membership.removed
      - project_membership.added
      - project_membership.role_changed
      - project_membership.removed
      - project.created
      - project.updated
      - project.deleted
      - project.exported
      - document.viewed
      - document.restored
      - document.deleted
      - attachment.uploaded
      - attachment.downloaded
      - attachment.deleted
      - task.deleted
      - deadline.deleted
      - dataset.deleted
      - analysis.deleted
      - result.deleted
      - decision.deleted
      - manuscript.deleted
      - ethics_approval.deleted
      - audit_log.viewed
      - handover.generated
      type: string
      description: |-
        * `auth.login` - Auth Login
        * `auth.login_failed` - Auth Login Failed
        * `auth.logout` - Auth Logout
        * `auth.password_changed` - Auth Password Changed
        * `auth.mfa_enabled` - Auth Mfa Enabled
        * `auth.mfa_disabled` - Auth Mfa Disabled
        * `lab.created` - Lab Created
        * `lab.updated` - Lab Updated
        * `membership.invited` - Membership Invited
        * `membership.invite_revoked` - Membership Invite Revoked
        * `membership.invite_accepted` - Membership Invite Accepted
        * `membership.role_changed` - Membership Role Changed
        * `membership.removed` - Membership Removed
        * `project_membership.added` - Project Membership Added
        * `project_membership.role_changed` - Project Membership Role Changed
        * `project_membership.removed` - Project Membership Removed
        * `project.created` - Project Created
        * `project.updated` - Project Updated
        * `project.deleted` - Project Deleted
        * `project.exported` - Project Exported
        * `document.viewed` - Document Viewed
        * `document.restored` - Document Restored
        * `document.deleted` - Document Deleted
        * `attachment.uploaded` - Attachment Uploaded
        * `attachment.downloaded` - Attachment Downloaded
        * `attachment.deleted` - Attachment Deleted
        * `task.deleted` - Task Deleted
        * `deadline.deleted` - Deadline Deleted
        * `dataset.deleted` - Dataset Deleted
        * `analysis.deleted` - Analysis Deleted
        * `result.deleted` - Result Deleted
        * `decision.deleted` - Decision Deleted
        * `manuscript.deleted` - Manuscript Deleted
        * `ethics_approval.deleted` - Ethics Approval Deleted
        * `audit_log.viewed` - Audit Log Viewed
        * `handover.generated` - Handover Generated
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        target_label:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - ip
      - metadata
      - target_id
      - target_label
      - target_type
    Institution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
      required:
      - id
      - name
    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        invited_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role
    InviteCreate:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        email:
          type: string
          format: email
      required:
      - email
      - role
    InvitePreview:
      type: object
      properties:
        lab_name:
          type: string
        role:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - lab_name
      - role
    Lab:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        institution:
          allOf:
          - $ref: '#/components/schemas/Institution'
          readOnly: true
        my_role:
          type: string
          nullable: true
          readOnly: true
        my_permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - id
      - institution
      - my_permissions
      - my_role
      - name
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - role
      - user
    PaginatedAuditEventList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    PatchedLab:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        institution:
          allOf:
          - $ref: '#/components/schemas/Institution'
          readOnly: true
        my_role:
          type: string
          nullable: true
          readOnly: true
        my_permissions:
          type: array
          items:
            type: string
          readOnly: true
    PatchedRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    PatchedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 120
    RoleEnum:
      enum:
      - pi
      - lab_admin
      - member
      - viewer
      type: string
      description: |-
        * `pi` - Pi
        * `lab_admin` - Lab Admin
        * `member` - Member
        * `viewer` - Viewer
    Token:
      type: object
      properties:
        token:
          type: string
          maxLength: 200
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 120
      required:
      - email
      - id
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
