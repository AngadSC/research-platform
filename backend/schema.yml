          - $ref: '#/components/schemas/User'
          readOnly: true
        ran_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code_attachment
      - code_commit
      - code_repo_url
      - created_at
      - datasets
      - description
      - id
      - project
      - ran_at
      - ran_by
      - results
      - title
      - updated_at
    AnalysisInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
        description:
          type: string
        code_repo_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        code_commit:
          type: string
          maxLength: 40
        code_attachment:
          type: string
          format: uuid
          nullable: true
        datasets:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
        ran_by:
          type: string
          format: uuid
        ran_at:
          type: string
          format: date-time
      required:
      - title
