openapi: 3.0.3
info:
  title: Research Workspace API
  version: 0.1.0
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/integrations/oauth/callback/:
    get:
      operationId: integrations_oauth_callback_retrieve
      description: The browser comes back from the provider here. Always ends in a
        redirect to the SPA.
      tags:
      - integrations
      security:
      - sessionAuth: []
      responses:
        '302':
          description: No response body
  /api/invites/accept/:
    post:
      operationId: invites_accept_create
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/invites/preview/:
    post:
      operationId: invites_preview_create
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
