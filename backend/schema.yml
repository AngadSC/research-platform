components:
  schemas:
    ActionEnum:
      enum:
      - auth.login
      - auth.login_failed
      - auth.logout
      - auth.password_changed
      - auth.mfa_enabled
      - auth.mfa_disabled
      - lab.created
      - lab.updated
      - membership.invited
      - membership.invite_revoked
      - membership.invite_accepted
      - membership.role_changed
      - membership.removed
      - project_membership.added
      - project_membership.role_changed
      - project_membership.removed
      - project.created
      - project.updated
      - project.deleted
      - project.exported
      - document.viewed
      - document.restored
      - document.deleted
      - attachment.uploaded
      - attachment.downloaded
      - attachment.deleted
      - task.deleted
      - deadline.deleted
      - dataset.deleted
      - analysis.deleted
      - result.deleted
      - decision.deleted
      - manuscript.deleted
      - ethics_approval.deleted
      - audit_log.viewed
      - handover.generated
      type: string
      description: |-
        * `auth.login` - Auth Login
        * `auth.login_failed` - Auth Login Failed
        * `auth.logout` - Auth Logout
        * `auth.password_changed` - Auth Password Changed
        * `auth.mfa_enabled` - Auth Mfa Enabled
        * `auth.mfa_disabled` - Auth Mfa Disabled
        * `lab.created` - Lab Created
        * `lab.updated` - Lab Updated
        * `membership.invited` - Membership Invited
        * `membership.invite_revoked` - Membership Invite Revoked
        * `membership.invite_accepted` - Membership Invite Accepted
        * `membership.role_changed` - Membership Role Changed
        * `membership.removed` - Membership Removed
        * `project_membership.added` - Project Membership Added
        * `project_membership.role_changed` - Project Membership Role Changed
        * `project_membership.removed` - Project Membership Removed
        * `project.created` - Project Created
        * `project.updated` - Project Updated
        * `project.deleted` - Project Deleted
        * `project.exported` - Project Exported
        * `document.viewed` - Document Viewed
        * `document.restored` - Document Restored
        * `document.deleted` - Document Deleted
        * `attachment.uploaded` - Attachment Uploaded
        * `attachment.downloaded` - Attachment Downloaded
        * `attachment.deleted` - Attachment Deleted
        * `task.deleted` - Task Deleted
        * `deadline.deleted` - Deadline Deleted
        * `dataset.deleted` - Dataset Deleted
        * `analysis.deleted` - Analysis Deleted
        * `result.deleted` - Result Deleted
        * `decision.deleted` - Decision Deleted
        * `manuscript.deleted` - Manuscript Deleted
        * `ethics_approval.deleted` - Ethics Approval Deleted
        * `audit_log.viewed` - Audit Log Viewed
        * `handover.generated` - Handover Generated
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        original_filename:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        notice_acknowledged_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - id
      - notice_acknowledged_at
      - original_filename
      - project
      - sha256
      - size_bytes
      - uploaded_by
    AttachmentUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
        acknowledged_notice:
          type: boolean
          default: false
      required:
      - file
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        target_label:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - ip
      - metadata
      - target_id
      - target_label
      - target_type
    Conflict:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        current_version:
          type: integer
        updated_by:
          $ref: '#/components/schemas/User'
        updated_at:
          type: string
          format: date-time
      required:
      - code
      - current_version
      - detail
      - updated_at
      - updated_by
    Deadline:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
