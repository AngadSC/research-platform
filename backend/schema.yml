      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        code_repo_url:
          type: string
          format: uri
          readOnly: true
        code_commit:
          type: string
          readOnly: true
        code_attachment:
          allOf:
          - $ref: '#/components/schemas/AttachmentRef'
          readOnly: true
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRef'
          readOnly: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ResultRef'
          readOnly: true
