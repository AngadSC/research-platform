  /api/labs/{lab_id}/attachments/{attachment_id}/:
    get:
      operationId: labs_attachments_retrieve
      description: |-
        HasPerm reads `view.project`. Collection routes take the project from the URL (404 if
        not visible); item routes take it from the visible object the URL names, so an invisible
        object is a 404 before any 403 (D21).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: labs_attachments_destroy
      description: |-
        HasPerm reads `view.project`. Collection routes take the project from the URL (404 if
        not visible); item routes take it from the visible object the URL names, so an invisible
        object is a 404 before any 403 (D21).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/labs/{lab_id}/attachments/{attachment_id}/download/:
    get:
