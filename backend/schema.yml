              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/labs/{lab_id}/:
    get:
      operationId: labs_retrieve
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
    patch:
      operationId: labs_partial_update
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLab'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLab'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLab'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/labs/{lab_id}/analyses/{analysis_id}/:
    get:
      operationId: labs_analyses_retrieve
      description: |-
        One view pair per kind. `ProjectScopedMixin` resolves and permission-checks the project
        (404 if invisible); reads then go through `serializers.queryset`, which is scoped to that
        project and prefetches every nested link, so no list or detail makes per-row queries.
      parameters:
      - in: path
        name: analysis_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          description: ''
    patch:
      operationId: labs_analyses_partial_update
      description: |-
        One view pair per kind. `ProjectScopedMixin` resolves and permission-checks the project
        (404 if invisible); reads then go through `serializers.queryset`, which is scoped to that
        project and prefetches every nested link, so no list or detail makes per-row queries.
      parameters:
      - in: path
        name: analysis_id
