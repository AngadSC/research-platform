  /api/labs/{lab_id}/deadlines/{projectdeadline_id}/:
    patch:
      operationId: labs_deadlines_partial_update
      description: |-
        Resolves `self.project` before permissions run (ARCHITECTURE section 2), so a project
        or item the user cannot see is a 404 and HasPerm checks the project's perms.

        - `<project_id>` in the URL (nested collections and the project itself): that project.
        - otherwise `lookup_url_kwarg` (flat item routes): the item's project.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: projectdeadline_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeadlineInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeadlineInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeadlineInput'
      security:
      - sessionAuth: []
      responses:
