openapi: 3.0.3
info:
  title: Research Workspace API
  version: 0.1.0
paths:
  /api/ai/grants/:
    get:
      operationId: ai_grants_list
      description: Your connected AI apps and access tokens. POST creates a personal
        access token (D164).
      tags:
      - ai
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
          description: ''
    post:
      operationId: ai_grants_create
      description: Your connected AI apps and access tokens. POST creates a personal
        access token (D164).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatCreate'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatCreated'
          description: ''
  /api/ai/grants/{aigrant_id}/:
    delete:
      operationId: ai_grants_destroy
      description: Revoke one of your own grants; anyone else's is a 404.
      parameters:
      - in: path
        name: aigrant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/keys/:
    get:
      operationId: ai_keys_list
      tags:
      - ai
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyStatus'
          description: ''
  /api/ai/keys/{ai_provider}/:
    put:
      operationId: ai_keys_update
      description: |-
        PUT checks the key with the provider (one free call) and stores it encrypted; the answer
        never contains it. PATCH changes the Anthropic refusal-fallback setting. DELETE removes it.
      parameters:
      - in: path
        name: ai_provider
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeySave'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KeySave'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KeySave'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyStatus'
          description: ''
    patch:
      operationId: ai_keys_partial_update
      description: |-
        PUT checks the key with the provider (one free call) and stores it encrypted; the answer
        never contains it. PATCH changes the Anthropic refusal-fallback setting. DELETE removes it.
      parameters:
      - in: path
        name: ai_provider
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedKeyUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedKeyUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedKeyUpdate'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyStatus'
          description: ''
    delete:
      operationId: ai_keys_destroy
      description: |-
        PUT checks the key with the provider (one free call) and stores it encrypted; the answer
        never contains it. PATCH changes the Anthropic refusal-fallback setting. DELETE removes it.
      parameters:
      - in: path
        name: ai_provider
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login-methods/:
    post:
      operationId: auth_login_methods_create
      description: |-
        Email-first sign-in (D156): which ways in this address has. Answers by domain only, so it
        says nothing about whether an account exists. POST keeps the address out of URLs and logs.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMethodsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginMethodsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginMethodsRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginMethods'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/integrations/oauth/callback/:
    get:
      operationId: integrations_oauth_callback_retrieve
      description: The browser comes back from the provider here. Always ends in a
        redirect to the SPA.
      tags:
      - integrations
      security:
      - sessionAuth: []
      responses:
        '302':
          description: No response body
  /api/invites/accept/:
    post:
      operationId: invites_accept_create
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/invites/preview/:
    post:
      operationId: invites_preview_create
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
          description: ''
  /api/labs/:
    get:
      operationId: labs_list
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lab'
          description: ''
    post:
      operationId: labs_create
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lab'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lab'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Lab'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/labs/{lab_id}/:
    get:
      operationId: labs_retrieve
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
    patch:
      operationId: labs_partial_update
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLabDetailsInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLabDetailsInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLabDetailsInput'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
  /api/labs/{lab_id}/ai-grants/:
    get:
      operationId: labs_ai_grants_list
      description: 'Every active AI grant that names this lab (manage_lab_integrations:
        pi, lab_admin).'
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabGrant'
          description: ''
  /api/labs/{lab_id}/ai-grants/{aigrant_id}/:
    delete:
      operationId: labs_ai_grants_destroy
      description: Remove this lab from a member's grant (the grant ends if no lab
        is left).
      parameters:
      - in: path
        name: aigrant_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/labs/{lab_id}/ai-policy/:
    get:
      operationId: labs_ai_policy_retrieve
      description: 'The lab''s AI policy (D188): everyone in the lab reads it; pi
        and lab_admin change it.'
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: ''
    patch:
      operationId: labs_ai_policy_partial_update
      description: 'The lab''s AI policy (D188): everyone in the lab reads it; pi
        and lab_admin change it.'
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPolicy'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPolicy'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPolicy'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: ''
  /api/labs/{lab_id}/analyses/{analysis_id}/:
    get:
      operationId: labs_analyses_retrieve
      description: |-
        One view pair per kind. `ProjectScopedMixin` resolves and permission-checks the project
        (404 if invisible); reads then go through `serializers.queryset`, which is scoped to that
        project and prefetches every nested link, so no list or detail makes per-row queries.
      parameters:
      - in: path
        name: analysis_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          description: ''
    patch:
      operationId: labs_analyses_partial_update
      description: |-
        One view pair per kind. `ProjectScopedMixin` resolves and permission-checks the project
        (404 if invisible); reads then go through `serializers.queryset`, which is scoped to that
        project and prefetches every nested link, so no list or detail makes per-row queries.
      parameters:
      - in: path
        name: analysis_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnalysisInput'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          description: ''
    delete:
      operationId: labs_analyses_destroy
      description: |-
        One view pair per kind. `ProjectScopedMixin` resolves and permission-checks the project
        (404 if invisible); reads then go through `serializers.queryset`, which is scoped to that
        project and prefetches every nested link, so no list or detail makes per-row queries.
      parameters:
      - in: path
        name: analysis_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/labs/{lab_id}/assistant/config/:
    get:
      operationId: labs_assistant_config_retrieve
      description: |-
        ARCHITECTURE section 2: anonymous gets 401, then the lab is resolved (404 if the user
        is not a member) before permissions run. Item lookups go through `get_queryset()`.
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantConfig'
          description: ''
  /api/labs/{lab_id}/assistant/conversations/:
    get:
      operationId: labs_assistant_conversations_list
      description: Your conversations in this lab (never anyone else's, lab managers
        included).
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: labs_assistant_conversations_create
      description: Your conversations in this lab (never anyone else's, lab managers
        included).
      parameters:
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/labs/{lab_id}/assistant/conversations/{conversation_id}/:
    get:
      operationId: labs_assistant_conversations_retrieve
      description: Read or delete your own conversation. Another person's is a 404.
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: ''
    delete:
      operationId: labs_assistant_conversations_destroy
      description: Read or delete your own conversation. Another person's is a 404.
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/labs/{lab_id}/assistant/conversations/{conversation_id}/approvals/:
    post:
      operationId: labs_assistant_conversations_approvals_create
      description: Approve or decline the write actions the assistant is waiting on,
        then stream on.
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Server-sent events
  /api/labs/{lab_id}/assistant/conversations/{conversation_id}/messages/:
    post:
      operationId: labs_assistant_conversations_messages_create
      description: Send a message; the answer streams back as server-sent events (text/event-stream).
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageInput'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Server-sent events
  /api/labs/{lab_id}/attachments/{attachment_id}/:
    get:
      operationId: labs_attachments_retrieve
      description: |-
        HasPerm reads `view.project`. Collection routes take the project from the URL (404 if
        not visible); item routes take it from the visible object the URL names, so an invisible
        object is a 404 before any 403 (D21).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: labs_attachments_destroy
      description: |-
        HasPerm reads `view.project`. Collection routes take the project from the URL (404 if
        not visible); item routes take it from the visible object the URL names, so an invisible
        object is a 404 before any 403 (D21).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/labs/{lab_id}/attachments/{attachment_id}/download/:
    get:
      operationId: labs_attachments_download_retrieve
      description: 'ARCHITECTURE section 8: scoped lookup, permission, audit, then
        stream.'
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lab_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - labs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/labs/{lab_id}/audit-events/:
    get:
      operationId: labs_audit_events_list
      description: Read-only. AuditEvent is not lab-scoped (D23), so the lab filter
        is explicit here.
      parameters:
      - in: query
        name: action
        schema:
          enum:
          - auth.login
          - auth.login_failed
          - auth.logout
          - auth.password_changed
          - auth.mfa_enabled
          - auth.mfa_disabled
          - lab.created
          - lab.updated
          - membership.invited
          - membership.invite_revoked
          - membership.invite_accepted
          - membership.role_changed
          - membership.removed
          - project_membership.added
          - project_membership.role_changed
          - project_membership.removed
          - project.created
          - project.updated
          - project.deleted
          - project.exported
          - document.viewed
          - document.restored
          - document.deleted
          - attachment.uploaded
          - attachment.downloaded
          - attachment.deleted
          - task.deleted
          - task_post.deleted
          - deadline.deleted
          - dataset.created
          - dataset.updated
          - dataset.deleted
          - analysis.created
          - analysis.updated
          - analysis.deleted
          - result.created
          - result.updated
          - result.deleted
          - decision.created
          - decision.updated
          - decision.deleted
          - manuscript.created
          - manuscript.updated
          - manuscript.deleted
          - ethics_approval.created
          - ethics_approval.updated
          - ethics_approval.links_changed
          - ethics_approval.deleted
          - retention.changed
          - audit_log.viewed
          - handover.generated
          - task.unassigned
          - auth.social_connected
          - auth.social_disconnected
          - auth.email_added
          - auth.email_removed
          - integration.connected
          - integration.disconnected
          - integration.revoked
          - integration.refresh_failed
          - integration.picker_token_issued
          - external_link.created
          - external_link.removed
          - external_link.change_accepted
          - chat_message.deleted
          - integration.searched
          - inventory_item.created
          - inventory_item.updated
          - inventory_item.deleted
          - inventory.exported
          - onboarding_item.created
          - onboarding_item.updated
          - onboarding_item.deleted
          - onboarding.completion_changed
          - institution_resource.created
          - institution_resource.updated
          - institution_resource.deleted
          - funding.created
          - funding.updated
          - funding.deleted
          - review_item.created
          - review_item.updated
          - review_item.deleted
          - recruitment_entry.created
          - recruitment_entry.updated
          - recruitment_entry.deleted
          - recruitment_plan.updated
          - ai_access.granted
          - ai_access.revoked
          - ai_tool.write
          - ai_key.saved
          - ai_key.removed
          - training_requirement.created
          - training_requirement.updated
          - training_requirement.deleted
          - training_record.created
          - training_record.updated
          - training_record.verified
          - training_record.deleted
          - dmp.created
